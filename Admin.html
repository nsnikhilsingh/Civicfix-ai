

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicFix AI | Demo Admin Panel</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .admin-wrap {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .admin-box {
      background: #fff;
      color: #222;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px #00000012;
    }

    .admin-box input,
    .admin-box button,
    .admin-box select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .admin-box button {
      background: #126b50;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    .admin-card {
      border: 1px solid #ddd;
      padding: 16px;
      border-radius: 10px;
      margin: 14px 0;
      overflow-wrap: anywhere;
    }

    .hidden { display: none; }

    .admin-note {
      color: #a33;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-icon">C</div>
      <div>
        <h1>CivicFix <span>AI</span></h1>
        <p>Demo Admin Dashboard</p>
      </div>
    </div>
    <a class="header-button" href="index.html">Main Website</a>
  </header>

  <main class="admin-wrap">
    <section class="admin-box" id="loginBox">
      <h2>Admin Login</h2>
      <p>Sign in to manage demo complaints.</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button type="submit">Login</button>
      </form>

      <p id="loginMessage" role="status"></p>
      <p class="admin-note">
        Demo only: credentials are visible in client-side code.
        Do not use this login to protect real or sensitive data.
      </p>
    </section>

    <section class="admin-box hidden" id="dashboard">
      <h2>Complaint Management</h2>
      <p id="summary">Loading complaints...</p>
      <button type="button" id="refreshButton">Refresh Complaints</button>
      <button type="button" id="logoutButton">Logout</button>
      <div id="adminComplaints"></div>
    </section>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "civicfixComplaints";

    // DEMO credentials only. This is NOT secure authentication.
    const DEMO_USERNAME = "demo";
    const DEMO_PASSWORD = "civic123";

    const loginBox = document.getElementById("loginBox");
    const dashboard = document.getElementById("dashboard");
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("loginMessage");
    const adminComplaints = document.getElementById("adminComplaints");
    const summary = document.getElementById("summary");

    function getComplaints() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function showLogin() {
      loginBox.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }

    function showDashboard() {
      loginBox.classList.add("hidden");
      dashboard.classList.remove("hidden");
      renderAdmin();
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (
        username === DEMO_USERNAME &&
        password === DEMO_PASSWORD
      ) {
        loginMessage.textContent = "";
        sessionStorage.setItem("civicfixDemoAdmin", "true");
        showDashboard();
      } else {
        loginMessage.textContent = "Incorrect username or password.";
      }
    });

    function renderAdmin() {
      const complaints = getComplaints();
      adminComplaints.replaceChildren();

      summary.textContent =
        "Total complaints: " + complaints.length;

      if (!complaints.length) {
        const empty = document.createElement("p");
        empty.textContent =
          "No complaints found in this browser. Submit a complaint on the main website first.";
        adminComplaints.appendChild(empty);
        return;
      }

      complaints.forEach(function (complaint, index) {
        const card = document.createElement("article");
        card.className = "admin-card";

        const heading = document.createElement("h3");
        heading.textContent = complaint.category || "Other";

        const id = document.createElement("p");
        id.textContent = "ID: " + (complaint.id || "N/A");

        const location = document.createElement("p");
        location.textContent = "Location: " + (complaint.location || "N/A");

        const description = document.createElement("p");
        description.textContent = complaint.description || "";

        const priority = document.createElement("p");
        priority.textContent =
          "Priority: " + (complaint.priority || "Low");

        const label = document.createElement("label");
        label.textContent = "Complaint status";

        const select = document.createElement("select");
        ["Submitted", "In Progress", "Resolved"].forEach(function (status) {
          const option = document.createElement("option");
          option.value = status;
          option.textContent = status;
          select.appendChild(option);
        });

        select.value = [
          "Submitted", "In Progress", "Resolved"
        ].includes(complaint.status) ? complaint.status : "Submitted";

        const saveButton = document.createElement("button");
        saveButton.type = "button";
        saveButton.textContent = "Save Status";

        saveButton.addEventListener("click", function () {
          const latest = getComplaints();
          const target = latest.find(function (item) {
            return item.id === complaint.id;
          });

          if (!target) {
            alert("Complaint not found. Refresh and try again.");
            renderAdmin();
            return;
          }

          target.status = select.value;

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(latest));
            alert("Demo status updated successfully.");
            renderAdmin();
          } catch {
            alert("Could not save the status in this browser.");
          }
        });

        label.appendChild(select);
        card.append(heading, id, location, description, priority, label, saveButton);
        adminComplaints.appendChild(card);
      });
    }

    document.getElementById("refreshButton")
      .addEventListener("click", renderAdmin);

    document.getElementById("logoutButton")
      .addEventListener("click", function () {
        sessionStorage.removeItem("civicfixDemoAdmin");
        loginForm.reset();
        showLogin();
      });

    if (sessionStorage.getItem("civicfixDemoAdmin") === "true") {
      showDashboard();
    }
  </script>
</body>
</html>
